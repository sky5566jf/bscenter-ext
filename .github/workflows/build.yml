name: build-center-ext

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 6.6.0 (msvc2019_64)
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.6.0 win64_msvc2019_64 -O C:\Qt

      - name: Show Qt
        run: |
          dir C:\Qt
          if (Test-Path C:\Qt\6.6.0\msvc2019_64) { dir C:\Qt\6.6.0\msvc2019_64 } else { Write-Error "Qt path missing"; exit 1 }

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH=C:/Qt/6.6.0/msvc2019_64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Collect
        run: |
          mkdir out
          copy build\Release\bbcenter_ext.dll out\
          copy build\Release\BBCenterLoader.exe out\
          dir out

      - uses: actions/upload-artifact@v4
        with:
          name: bbcenter-ext-poc
          path: out/*
