name: build-center-ext

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose toolchain
        continue-on-error: true
        run: |
          Write-Host "=== vswhere ==="
          $vs = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vs) { & $vs -all -products * -format value -property installationPath } else { Write-Host "vswhere not found" }
          Write-Host "=== cmake generators ==="
          cmake --help | Select-String -Pattern "Visual Studio|Ninja|NMake"

      - name: Install Qt 6.6.3 (msvc2019_64)
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 -O C:\Qt
          if (!(Test-Path C:\Qt\6.6.3\msvc2019_64\include\QtWidgets)) { Write-Error "Qt include missing"; exit 1 }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=C:/Qt/6.6.3/msvc2019_64

      - name: Build
        run: cmake --build build

      - name: Collect
        run: |
          mkdir out
          copy build\bbcenter_ext.dll out\
          copy build\BBCenterLoader.exe out\
          dir out
          dumpbin /DEPENDENTS out\bbcenter_ext.dll | Select-String -Pattern "Qt6"

      - uses: actions/upload-artifact@v4
        with:
          name: bbcenter-ext-poc
          path: out/*
